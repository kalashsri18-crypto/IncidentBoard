<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IncidentBoard</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap"><header class="hero"><h1>🚨 IncidentBoard</h1><p>A lightweight board to report, assign and resolve team issues.</p><div id="stats"></div></header><section class="panel"><h2>Report an issue</h2><form id="create"><input name="title" placeholder="Issue title" required><input name="category" placeholder="Category"><input name="assignee" placeholder="Assign to"><select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select><textarea name="description" placeholder="Describe the issue"></textarea><button>Create issue</button></form></section><section class="panel"><h2>Issue board</h2><form id="filters"><select name="status"><option value="">All statuses</option><option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option></select><select name="priority"><option value="">All priorities</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select><button class="secondary">Filter</button></form><div id="issues" class="items"></div></section></main><script>
const el=id=>document.getElementById(id);async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let d=r.status===204?null:await r.json();if(!r.ok)throw Error(d?.error||'Request failed');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){let filters=new URLSearchParams(new FormData(el('filters')));let [a,s]=await Promise.all([api('/api/issues?'+filters),api('/api/stats')]);el('stats').textContent=Object.entries(s).map(([k,v])=>k+': '+v).join(' · ')||'No issues yet';el('issues').innerHTML=a.map(x=>'<article class="item"><div style="flex:1;min-width:230px"><span class="pill">'+esc(x.priority)+'</span> <span class="pill">'+esc(x.status)+'</span><h3>#'+x.id+' · '+esc(x.title)+'</h3><p>'+esc(x.description)+'</p><small class="muted">'+esc(x.category)+' · '+(esc(x.assignee)||'Unassigned')+'</small></div><div class="actions"><select id="s'+x.id+'"><option '+(x.status==='Open'?'selected':'')+'>Open</option><option '+(x.status==='In Progress'?'selected':'')+'>In Progress</option><option '+(x.status==='Resolved'?'selected':'')+'>Resolved</option><option '+(x.status==='Closed'?'selected':'')+'>Closed</option></select><button onclick="save('+x.id+')">Update</button><button class="secondary" onclick="history('+x.id+')">History</button><button class="danger" onclick="removeIssue('+x.id+')">Delete</button></div></article>').join('')||'<p class="empty">No issues match these filters.</p>'}
el('create').onsubmit=async e=>{e.preventDefault();try{await api('/api/issues',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()}catch(x){alert(x.message)}};el('filters').onsubmit=e=>{e.preventDefault();load()};async function save(id){await api('/api/issues/'+id,{method:'PATCH',body:JSON.stringify({status:el('s'+id).value})});load()}async function history(id){let a=await api('/api/issues/'+id+'/activity');alert(a.map(x=>x.created_at+' — '+x.action).join('\n'))}async function removeIssue(id){if(confirm('Delete this issue?')){await api('/api/issues/'+id,{method:'DELETE'});load()}}load();
</script></body></html>
